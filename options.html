<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>agnubin 설정</title><link rel="stylesheet" href="shared.css"></head>
  <body class="options-body">
    <header class="topbar">
      <a class="brand-link" href="#data"><img id="settings-brand-icon" src="assets/agnubin-dark-raw.png" alt="agnubin"><strong>agnubin</strong></a>
      <nav><a href="#data">지울 항목</a><a href="#sites">사이트</a><a href="#auto-clean">자동 정리</a><a href="#theme">테마</a><a href="#shortcuts">단축키</a></nav>
    </header>
    <main class="options-main">
      <section class="settings-section" id="data">
        <div class="section-head"><h1>지울 항목</h1><label class="range-select">기간 <select id="time-range"><option value="hour">최근 1시간</option><option value="day">최근 24시간</option><option value="week">최근 7일</option><option value="month">최근 30일</option><option value="all">전체 기간</option></select></label></div>
        <div class="type-grid" id="type-grid"></div>
      </section>
      <section class="settings-section" id="sites">
        <h2>사이트</h2>
        <form class="site-form" id="site-form"><input id="site-input" type="text" placeholder="https://example.com" autocomplete="off"><button class="button button-main" type="submit">추가</button></form>
        <ul class="site-list" id="site-list"></ul>
      </section>
      <section class="settings-section" id="auto-clean">
        <h2>자동 정리</h2>
        <div class="setting-row"><span>브라우저를 닫을 때</span><label class="switch"><input id="auto-clean-toggle" type="checkbox"><span class="switch-track" aria-hidden="true"></span><span class="sr-only">브라우저를 닫을 때 자동 정리</span></label></div>
        <div class="setting-row"><span>주기 정리</span><div class="interval-controls" id="interval-controls"><label>매 <input id="interval-minutes" type="number" min="1" max="10080" step="1" inputmode="numeric"> 분</label><label class="switch"><input id="interval-clean-toggle" type="checkbox"><span class="switch-track" aria-hidden="true"></span><span class="sr-only">주기마다 자동 정리</span></label></div></div>
      </section>
      <section class="settings-section" id="theme">
        <h2>테마</h2>
        <div class="theme-picker" role="radiogroup" aria-label="테마 선택"><button type="button" data-theme-choice="system"><span class="theme-symbol">◐</span><strong>시스템</strong></button><button type="button" data-theme-choice="light"><span class="theme-symbol">☼</span><strong>밝게</strong></button><button type="button" data-theme-choice="dark"><span class="theme-symbol">◒</span><strong>어둡게</strong></button></div>
      </section>
      <section class="settings-section" id="shortcuts">
        <h2>단축키</h2>
        <div class="command-list" id="command-list"></div>
        <button class="button button-soft" id="open-shortcuts" type="button">단축키 설정 열기</button>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
